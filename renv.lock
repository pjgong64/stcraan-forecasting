    "kSamples": {
      "Package": "kSamples",
      "Version": "1.2-12",
      "Source": "Repository",
      "Type": "Package",
      "Title": "K-Sample Rank Tests and their Combinations",
      "Date": "2025-08-25",
      "Authors@R": "c(person(\"Fritz\", \"Scholz\",role=c(\"aut\",\"cre\"),email = \"fscholz@u.washington.edu\"), person(\"Angie\", \"Zhu\", role=c(\"aut\"), email= \"a.zhu.stat@gmail.com\"))",
